---
namespace: mariadb-cluster

mariadb-common:
  metadata:
    name: mariadb
    description: |
      MariaDB is a popular open-source relational database management system (RDBMS) that is compatible with MySQL.
      It was initially created as a fork of MySQL in 2009 by the original developers of }/mariadb-conf:/etc/mysql/conf.d
      MariaDB offers many additional features and enhancements over MySQL, including improved performance, scalability, and security.
      It also includes several advanced features such as support for dynamic columns, parallel replication, and built-in support for geographic information system (GIS) data.
    tags: stored procedures, triggers, self hosted, query optimization, mysql alternative, database, replication, clustering
    website: https://mariadb.org/
    source: https://github.com/MariaDB/
    publisher: monk.io
    icon: https://www.vectorlogo.zone/logos/mariadb/mariadb-ar21.png
    private: true
  services:
    mariadb-svc:
      port: 3306
      container: mariadb
      protocol: tcp
  connections:
    leader:
      runnable: mariadb-cluster/leader
      service: mariadb-svc
    follower1:
      runnable: mariadb-cluster/follower1
      service: mariadb-svc
    follower2:
      runnable: mariadb-cluster/follower2
      service: mariadb-svc
  variables:
    image_tag:
      type: string
      value: <- $mariadb_image_tag default("10.10")
    database_name:
      type: string
      env: MYSQL_DATABASE
      value: <- $mariadb_database_name default("monk")
    database_user:
      env: MYSQL_USER
      type: string
      value: <- $mariadb_database_user default("db_user")
    database_password:
      env: MYSQL_PASSWORD
      type: string
      value: <- $mariadb_database_password default("RhgDPXPEnAgxxXYZ")
    database_root_password:
      env: MYSQL_ROOT_PASSWORD
      value: <- $mariadb_database_root_password default("RhgDPXPEnAgJ5q5g")
      type: string

leader:
  defines: runnable
  inherits: mariadb-cluster/mariadb-common
  containers:
    mariadb:
      paths:
        - <- `${monk-volume-path}/mariadb-leader:/var/lib/mysql`
      image-tag: <- $image_tag
      image: mariadb
  files:
    my-file:
      raw: true
      contents: |
        [mysqld]
        server-id=1
        log-bin=mysql-bin
        log-replica-updates=1
        datadir=/var/lib/mysql/
        innodb_flush_log_at_trx_commit = 2
        innodb_flush_method = O_DIRECT
        skip-host-cache
        skip-name-resolve
        default-authentication-plugin=mysql_native_password
      container: mariadb
      path: /etc/mysql/conf.d/leader.cnf
      mode: 644

follower1:
  defines: runnable
  inherits: mariadb-cluster/mariadb-common
  containers:
    mariadb:
      image-tag: <- $image_tag
      paths:
        - <- `${monk-volume-path}/mariadb-follower1:/var/lib/mysql`
      image: mariadb
  files:
    my-file:
      raw: true
      contents: |
        [mysqld]
        server-id=2
        log-bin=mysql-bin
        log-replica-updates=1
        auto_increment_increment=2
        auto_increment_offset=2
        datadir=/var/lib/mysql
        read-only=1
        replica-skip-errors = 1062
        skip-host-cache
        skip-name-resolve
        default-authentication-plugin=mysql_native_password
      container: mariadb
      path: /etc/mysql/conf.d/follower1.cnf
      mode: 644

follower2:
  defines: runnable
  inherits: mariadb-cluster/mariadb-common
  containers:
    mariadb:
      image-tag: <- $image_tag
      paths:
        - <- `${monk-volume-path}/mariadb-follower2:/var/lib/mysql`
      image: mariadb
  files:
    my-file:
      raw: true
      contents: |
        [mysqld]
        server-id=3
        log-bin=mysql-bin
        log-replica-updates=1
        auto_increment_increment=2
        auto_increment_offset=2
        datadir=/var/lib/mysql
        read-only=1
        replica-skip-errors = 1062
        skip-host-cache
        skip-name-resolve
        default-authentication-plugin=mysql_native_password
      container: mariadb
      path: /etc/mysql/conf.d/follower2.cnf
      mode: 644

configure:
  defines: runnable
  inherits: mariadb-cluster/mariadb-common
  variables:
    mariadb_leader_password:
      env: MYSQL_LEADER_PASSWORD
      type: string
      value: <- $mariadb_database_root_password
    mariadb_repl_user:
      env: MYSQL_REPLICATION_USER
      type: string
      value: <- $mariadb_database_repl_user
    mariadb_repl_password:
      env: MYSQL_REPLICATION_PASSWORD
      value: <- $mariadb_database_repl_password
      type: string
    database_monitor_password:
      env: MYSQL_MONITOR_PASSWORD
      value: <- $mariadb_database_monitor_password
      type: string
    database_monitor_user:
      env: MYSQL_MONITOR_USER
      value: <- $mariadb_database_monitor_user
      type: string
    database_leader_host:
      env: MYSQL_LEADER_HOST
      type: string
      value: <- connection-hostname("leader")
    database_follower1_host:
      env: MYSQL_FOLLOWER1_HOST
      type: string
      value: <- connection-hostname("follower1")
    mariadb-follower2-host:
      env: MYSQL_FOLLOWER2_HOST
      type: string
      value: <- connection-hostname("follower2")
  containers:
    mariadb:
      bash: /tmp/init.sh
      image-tag: <- $image_tag
      image: mariadb
  files:
    my-file:
      raw: true
      contents: |
        #!/bin/sh
        sleep 20
        while ! mysqladmin ping -u root -h $MYSQL_LEADER_HOST -p$MYSQL_ROOT_PASSWORD -h $MYSQL_LEADER_HOST --silent; do
          sleep 1
        done
        mysql -u root -h $MYSQL_LEADER_HOST -p$MYSQL_ROOT_PASSWORD  -e "RESET BINARY LOGS AND GTIDS;"
        mysql -u root -h $MYSQL_LEADER_HOST -p$MYSQL_ROOT_PASSWORD  -e "FLUSH TABLES WITH READ LOCK;"
        mysql -u root -p$MYSQL_ROOT_PASSWORD -h $MYSQL_LEADER_HOST -e "UNLOCK TABLES;"
        mysql -u root -p$MYSQL_ROOT_PASSWORD -h $MYSQL_LEADER_HOST -e "ALTER USER 'root'@'%' IDENTIFIED WITH mysql_native_password BY '$MYSQL_ROOT_PASSWORD';"
        mysql -u root -p$MYSQL_ROOT_PASSWORD -h $MYSQL_LEADER_HOST -e "CREATE USER '$MYSQL_MONITOR_USER'@'%' IDENTIFIED BY '$MYSQL_MONITOR_PASSWORD';"
        mysql -u root -p$MYSQL_ROOT_PASSWORD -h $MYSQL_LEADER_HOST -e "FLUSH PRIVILEGES;"
        mysqldump -uroot -h $MYSQL_LEADER_HOST  -p$MYSQL_ROOT_PASSWORD --all-databases --source-data --single-transaction --flush-logs --events --result-file=/tmp/leader_dump.sql
        mysql -h $MYSQL_FOLLOWER1_HOST -u root -p$MYSQL_ROOT_PASSWORD -e "STOP REPLICA;";
        mysql -h $MYSQL_FOLLOWER1_HOST -u root -p$MYSQL_ROOT_PASSWORD < /tmp/leader_dump.sql
        mysql -h $MYSQL_FOLLOWER2_HOST -u root -p$MYSQL_ROOT_PASSWORD -e "STOP REPLICA;";
        mysql -h $MYSQL_FOLLOWER2_HOST -u root -p$MYSQL_ROOT_PASSWORD < /tmp/leader_dump.sql
        log_file=`mysql -u root -p$MYSQL_ROOT_PASSWORD -h $MYSQL_LEADER_HOST -e "SHOW BINARY LOG STATUS\G" | grep File: | awk '{print $2}'`
        pos=`mysql -u root -p$MYSQL_ROOT_PASSWORD -h $MYSQL_LEADER_HOST -e "SHOW BINARY LOG STATUS\G" | grep Position: | awk '{print $2}'`
        mysql -u root -p$MYSQL_ROOT_PASSWORD -h $MYSQL_FOLLOWER1_HOST -e "RESET REPLICA";
        mysql -u root -p$MYSQL_ROOT_PASSWORD -h $MYSQL_FOLLOWER1_HOST -e "CHANGE REPLICATION SOURCE TO SOURCE_HOST='$MYSQL_LEADER_HOST', SOURCE_USER='root', SOURCE_PASSWORD='$MYSQL_ROOT_PASSWORD', SOURCE_LOG_FILE='${log_file}', SOURCE_LOG_POS=${pos};"
        mysql -u root -p$MYSQL_ROOT_PASSWORD -h $MYSQL_FOLLOWER1_HOST -e "start replica"
        mysql -u root -p$MYSQL_ROOT_PASSWORD -h $MYSQL_FOLLOWER2_HOST -e "RESET REPLICA";
        mysql -u root -p$MYSQL_ROOT_PASSWORD -h $MYSQL_FOLLOWER2_HOST -e "CHANGE REPLICATION SOURCE TO SOURCE_HOST='$MYSQL_LEADER_HOST', SOURCE_USER='root', SOURCE_PASSWORD='$MYSQL_ROOT_PASSWORD', SOURCE_LOG_FILE='${log_file}', SOURCE_LOG_POS=${pos};"
        mysql -u root -p$MYSQL_ROOT_PASSWORD -h $MYSQL_FOLLOWER2_HOST -e "start replica"
      container: mariadb
      path: /tmp/init.sh
      mode: 755
  depends:
    wait-for:
      runnables:
        - mariadb-cluster/leader
        - mariadb-cluster/follower1
        - mariadb-cluster/follower2
      timeout: 60
